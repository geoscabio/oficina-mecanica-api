name: CI

on:
  pull_request:
    branches:
      - develop
      - release
      - "release/**"
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate
    uses: ./.github/workflows/reusable-quality-gate.yml
    secrets: inherit
