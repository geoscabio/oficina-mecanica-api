name: AWS Diagnostics

on:
  workflow_dispatch:

jobs:
  inspect:
    name: Inspect existing AWS resources (read-only)
    runs-on: ubuntu-latest
    environment:
      name: development
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Caller identity
        run: aws sts get-caller-identity

      - name: ECR repositories
        run: aws ecr describe-repositories --repository-names oficina-api --region "$AWS_REGION" || echo "oficina-api ECR repo not found"

      - name: EKS clusters
        run: |
          aws eks list-clusters --region "$AWS_REGION"
          aws eks describe-cluster --name oficina-mecanica-eks-dev --region "$AWS_REGION" || echo "oficina-mecanica-eks-dev EKS cluster not found"

      - name: RDS instances
        run: |
          aws rds describe-db-instances --region "$AWS_REGION" \
            --query "DBInstances[].{Id:DBInstanceIdentifier,Status:DBInstanceStatus}" || echo "no RDS instances or query failed"

      - name: VPCs tagged for this project
        run: |
          aws ec2 describe-vpcs --region "$AWS_REGION" \
            --filters "Name=tag:Name,Values=*oficina*" \
            --query "Vpcs[].{Id:VpcId,Cidr:CidrBlock,Tags:Tags}"

      - name: NAT Gateways
        run: |
          aws ec2 describe-nat-gateways --region "$AWS_REGION" \
            --filter "Name=state,Values=available,pending" \
            --query "NatGateways[].{Id:NatGatewayId,VpcId:VpcId,State:State}"

      - name: Load Balancers tagged for this project
        run: |
          aws elbv2 describe-load-balancers --region "$AWS_REGION" \
            --query "LoadBalancers[].{Name:LoadBalancerName,Arn:LoadBalancerArn}" || true
          aws elb describe-load-balancers --region "$AWS_REGION" \
            --query "LoadBalancerDescriptions[].{Name:LoadBalancerName}" || true
