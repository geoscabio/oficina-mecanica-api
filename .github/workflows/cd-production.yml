name: CD Production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  quality-gate:
    name: Quality gate
    uses: ./.github/workflows/reusable-quality-gate.yml
    with:
      publish_image: true
    secrets: inherit

  deploy-production:
    name: Deploy production
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Register logical production deploy
        run: |
          echo "Production deploy is logical in this Tech Challenge repository."
          echo "No AWS production resources are provisioned because the physical environment does not exist."
          echo "The main branch records the approved production deploy."
