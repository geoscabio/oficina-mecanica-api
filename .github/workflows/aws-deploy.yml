name: AWS Deploy

on:
  workflow_call:
    inputs:
      environment_name:
        description: "GitHub Environment used by this deploy."
        required: true
        type: string
    outputs:
      terraform_action:
        description: "Resolved Terraform action: apply or destroy."
        value: ${{ jobs.deploy.outputs.terraform_action }}

env:
  TF_WORKING_DIRECTORY: infra/terraform/environments/dev
  ECR_REPOSITORY_NAME: oficina-api

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    outputs:
      terraform_action: ${{ steps.resolve_terraform_action.outputs.terraform_action }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || format('oficina-mecanica/{0}/terraform.tfstate', inputs.environment_name) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Terraform action
        id: resolve_terraform_action
        env:
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_AFTER: ${{ github.sha }}
        run: |
          control_file="$TF_WORKING_DIRECTORY/terraform-action.env"
          terraform_action="apply"

          if [ -f "$control_file" ]; then
            configured_action="$(grep -E '^[[:space:]]*TERRAFORM_ACTION[[:space:]]*=' "$control_file" | tail -n 1 | cut -d '=' -f 2- | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || true)"

            if [ -n "$configured_action" ]; then
              terraform_action="$configured_action"
            fi
          fi

          case "$terraform_action" in
            apply|destroy)
              ;;
            *)
              echo "::error::Invalid TERRAFORM_ACTION '$terraform_action'. Use 'apply' or 'destroy'."
              exit 1
              ;;
          esac

          if [ "$terraform_action" = "destroy" ]; then
            destroy_control_changed="false"

            if [ -z "$GITHUB_BEFORE" ] || [ "$GITHUB_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              destroy_control_changed="true"
            elif git diff --name-only "$GITHUB_BEFORE" "$GITHUB_AFTER" -- "$control_file" | grep -qx "$control_file"; then
              destroy_control_changed="true"
            fi

            if [ "$destroy_control_changed" != "true" ]; then
              echo "::error::TERRAFORM_ACTION=destroy is present but terraform-action.env was not changed in this push. Change it back to apply or open a dedicated destroy PR."
              exit 1
            fi

            echo "::warning::TERRAFORM_ACTION=destroy detected. This run will destroy AWS resources managed by Terraform."
          fi

          echo "TERRAFORM_ACTION=$terraform_action" >> "$GITHUB_ENV"
          echo "terraform_action=$terraform_action" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Validate deployment configuration
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          if [ "$TERRAFORM_ACTION" = "destroy" ]; then
            echo "Skipping application secret validation because this run will destroy the environment."
            exit 0
          fi

          missing=""

          for name in DB_PASSWORD JWT_SECRET WEBHOOK_TOKEN; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "Missing required GitHub Environment secrets:$missing"
            exit 1
          fi

      - name: Prepare deployment variables
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          state_bucket="${TF_STATE_BUCKET:-oficina-mecanica-tfstate-$account_id-$AWS_REGION}"

          echo "AWS_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "ECR_IMAGE_URI=$account_id.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY_NAME:sha-$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "TF_STATE_BUCKET=$state_bucket" >> "$GITHUB_ENV"

          if ! aws s3api head-bucket --bucket "$state_bucket" 2>/dev/null; then
            echo "Creating Terraform state bucket: $state_bucket"

            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket \
                --bucket "$state_bucket" \
                --region "$AWS_REGION"
            else
              aws s3api create-bucket \
                --bucket "$state_bucket" \
                --region "$AWS_REGION" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi

            aws s3api put-bucket-encryption \
              --bucket "$state_bucket" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

            aws s3api put-public-access-block \
              --bucket "$state_bucket" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi

          echo "Terraform state bucket confirmed: $state_bucket"

      - name: Write Terraform variables
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          EKS_CLUSTER_ROLE_NAME: ${{ vars.EKS_CLUSTER_ROLE_NAME || 'LabRole' }}
          EKS_NODE_ROLE_NAME: ${{ vars.EKS_NODE_ROLE_NAME || 'LabRole' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          terraform_action = os.environ["TERRAFORM_ACTION"]

          if terraform_action == "destroy":
              db_password = "DestroyOnly-2026!"
              jwt_secret = "destroy-only-placeholder"
              webhook_token = "destroy-only-placeholder"
          else:
              db_password = os.environ["DB_PASSWORD"]
              jwt_secret = os.environ["JWT_SECRET"]
              webhook_token = os.environ["WEBHOOK_TOKEN"]

          values = {
              "aws_region": os.environ["AWS_REGION"],
              "db_password": db_password,
              "eks_cluster_role_name": os.environ["EKS_CLUSTER_ROLE_NAME"],
              "eks_node_role_name": os.environ["EKS_NODE_ROLE_NAME"],
              "api_deploy_enabled": True,
              "api_image_uri": os.environ["ECR_IMAGE_URI"],
              "jwt_secret": jwt_secret,
              "webhook_token": webhook_token,
          }

          target = Path(os.environ["TF_WORKING_DIRECTORY"]) / "zz_ci.auto.tfvars.json"
          target.write_text(json.dumps(values), encoding="utf-8")
          PY

      - name: Terraform init
        run: |
          terraform -chdir="$TF_WORKING_DIRECTORY" init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" \
            -reconfigure \
            -input=false

      - name: Terraform validate
        run: terraform -chdir="$TF_WORKING_DIRECTORY" validate

      - name: Ensure ECR repository exists
        if: env.TERRAFORM_ACTION == 'apply'
        run: terraform -chdir="$TF_WORKING_DIRECTORY" apply -input=false -auto-approve -target=module.registry

      - name: Login to Amazon ECR
        if: env.TERRAFORM_ACTION == 'apply'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        if: env.TERRAFORM_ACTION == 'apply'
        run: |
          image_tag="sha-$GITHUB_SHA"

          if aws ecr describe-images --repository-name "$ECR_REPOSITORY_NAME" --image-ids imageTag="$image_tag" >/dev/null 2>&1; then
            echo "Image $ECR_IMAGE_URI already exists. Skipping Docker push."
            exit 0
          fi

          docker build -t "$ECR_IMAGE_URI" .
          docker push "$ECR_IMAGE_URI"

      - name: Terraform plan
        if: env.TERRAFORM_ACTION == 'apply'
        run: terraform -chdir="$TF_WORKING_DIRECTORY" plan -input=false -out=tfplan

      - name: Terraform apply
        if: env.TERRAFORM_ACTION == 'apply'
        run: terraform -chdir="$TF_WORKING_DIRECTORY" apply -input=false -auto-approve tfplan

      - name: Terraform destroy plan
        if: env.TERRAFORM_ACTION == 'destroy'
        run: terraform -chdir="$TF_WORKING_DIRECTORY" plan -destroy -input=false -out=tfdestroy

      - name: Terraform destroy
        if: env.TERRAFORM_ACTION == 'destroy'
        run: terraform -chdir="$TF_WORKING_DIRECTORY" apply -input=false -auto-approve tfdestroy

      - name: Read Terraform outputs
        if: env.TERRAFORM_ACTION == 'apply'
        run: |
          echo "EKS_CLUSTER_NAME=$(terraform -chdir="$TF_WORKING_DIRECTORY" output -raw eks_cluster_name)" >> "$GITHUB_ENV"

      - name: Setup kubectl
        if: env.TERRAFORM_ACTION == 'apply'
        uses: azure/setup-kubectl@v4

      - name: Configure EKS kubeconfig
        if: env.TERRAFORM_ACTION == 'apply'
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          kubectl config current-context

      - name: Install metrics server
        if: env.TERRAFORM_ACTION == 'apply'
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl rollout status deployment/metrics-server -n kube-system --timeout=180s

      - name: Wait for rollout
        if: env.TERRAFORM_ACTION == 'apply'
        run: |
          set +e
          kubectl rollout status deployment/oficina-api -n oficina --timeout=600s
          rollout_status=$?

          kubectl get pods -n oficina -o wide
          kubectl get svc oficina-api -n oficina
          kubectl get hpa oficina-api-hpa -n oficina

          if [ "$rollout_status" -ne 0 ]; then
            echo "::group::Deployment diagnostics"
            kubectl describe deployment oficina-api -n oficina || true
            kubectl describe pods -n oficina -l app=oficina-api || true
            kubectl logs deployment/oficina-api -n oficina --all-containers --tail=200 || true
            echo "::endgroup::"
            exit "$rollout_status"
          fi

      - name: Print LoadBalancer endpoint
        if: env.TERRAFORM_ACTION == 'apply'
        run: |
          for attempt in $(seq 1 30); do
            endpoint="$(kubectl get svc oficina-api -n oficina -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"

            if [ -n "$endpoint" ]; then
              echo "API_URL=http://$endpoint"
              exit 0
            fi

            echo "Waiting for AWS LoadBalancer endpoint... attempt $attempt/30"
            sleep 10
          done

          echo "LoadBalancer endpoint was not ready yet. Check it later with: kubectl get svc oficina-api -n oficina"
