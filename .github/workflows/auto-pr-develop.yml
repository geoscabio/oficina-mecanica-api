name: Auto PR to Develop

on:
  push:
    branches:
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "fix/**"
      - "refactor/**"
      - "chore/**"
      - "docs/**"
      - "test/**"
      - "ci/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  open-pr-to-develop:
    name: Open PR to develop
    runs-on: ubuntu-latest
    if: vars.AUTO_PR_ENABLED == 'true'

    steps:
      - name: Create or keep pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          existing_pr="$(gh pr list --repo "$GH_REPO" --base develop --head "$SOURCE_BRANCH" --state open --json number --jq '.[0].number // empty')"

          if [ -n "$existing_pr" ]; then
            echo "Pull request #$existing_pr already exists for $SOURCE_BRANCH -> develop."
            exit 0
          fi

          gh pr create \
            --repo "$GH_REPO" \
            --base develop \
            --head "$SOURCE_BRANCH" \
            --title "ci(flow): integrate $SOURCE_BRANCH into develop" \
            --body "PR automático aberto após push na branch \`$SOURCE_BRANCH\`. Os checks completos rodam no próprio PR antes do merge para \`develop\`."
