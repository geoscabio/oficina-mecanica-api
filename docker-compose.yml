services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: oficina-mecanica-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${OFICINA_SQL_SA_PASSWORD:?Configure a variavel OFICINA_SQL_SA_PASSWORD antes de executar o docker compose.}
    ports:
      - "14333:1433"
    volumes:
      - oficina-mecanica-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oficina-mecanica-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=OficinaMecanicaDb;User Id=sa;Password=${OFICINA_SQL_SA_PASSWORD:?Configure a variavel OFICINA_SQL_SA_PASSWORD antes de executar o docker compose.};TrustServerCertificate=True;
      Database__ApplyMigrationsOnStartup: "true"
      Database__SeedDemoData: "true"
      Jwt__Secret: ${OFICINA_JWT_SECRET:?Configure a variavel OFICINA_JWT_SECRET antes de executar o docker compose.}
    ports:
      - "5093:8080"

volumes:
  oficina-mecanica-sqlserver-data:
