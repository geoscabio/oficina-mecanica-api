apiVersion: v1
kind: Service

metadata:
  name: oficina-api
  namespace: oficina

spec:
  # AWS Academy: LoadBalancer cria recurso cobrado. Aplicar somente durante demonstracao
  # e remover com `kubectl delete -f infra/aws/k8s/api-service.yaml` ao finalizar.
  type: LoadBalancer

  selector:
    app: oficina-api

  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
